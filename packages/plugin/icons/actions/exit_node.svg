<?xml version="1.0" encoding="UTF-8"?>
<!--
  Exit Node — base state (action list).
  Tile-flip (#7): Gray900 tile, white glyph. Glyph = a node with an outbound
  arrow breaking to the upper-right (traffic routed *out* through an exit node);
  the tile colour carries on/off, so the glyph carries the *exit* identity.
  Biased down 8px for the title band.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <rect width="72" height="72" fill="#1F1E1E"/>
  <g transform="translate(0 8)" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="30" cy="42" r="15"/>
    <path d="M40 32 L54 18"/>
    <path d="M44 17 L55 17 L55 28"/>
  </g>
</svg>
