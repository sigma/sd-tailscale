  <rect width="72" height="72" fill="#1F1E1E"/>
  <g transform="translate(0 8)" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
    <path d="M25 27 a17 17 0 1 0 22 0"/>
    <line x1="36" y1="18" x2="36" y2="38"/>
  </g>
</svg>
